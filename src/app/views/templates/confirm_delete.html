{% extends "base.html" %}
{% block title %}Confirm delete - Nexus{% endblock %}
{% block content %}
<h1>Delete {{ what }}</h1>
<div class="card">
  <p>Delete the {{ what }}: <strong>{{ detail }}</strong>?</p>
  <p class="muted">This cannot be undone.</p>
  <form method="post" class="inline-fields">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="danger">Yes, delete</button>
    <a href="javascript:history.back()">Cancel</a>
  </form>
</div>
{% endblock %}
