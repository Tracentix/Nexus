{% extends "base.html" %}
{% block title %}Register - Nexus{% endblock %}
{% block content %}
<div class="auth-wrap">
<h1>Create your account</h1>
<form method="post" class="card form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="display_name">Display name</label>
  <input id="display_name" name="display_name" maxlength="100" required
         value="{{ request.form.get('display_name', '') }}">

  <label for="email">Email address</label>
  <input id="email" name="email" type="email" required
         value="{{ request.form.get('email', '') }}">

  <label for="password">Password (at least 8 characters)</label>
  <input id="password" name="password" type="password" required>

  <label for="confirm">Confirm password</label>
  <input id="confirm" name="confirm" type="password" required>

  <button type="submit">Register</button>
</form>
<p class="auth-note">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
</div>
{% endblock %}
